services:
  postgres:
    image: postgres:18-alpine
    shm_size: 256m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zero_repro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=5
    ports:
      - "6432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  zero-cache:
    image: rocicorp/zero:1.6.0-canary.12
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZERO_UPSTREAM_DB: postgresql://postgres:postgres@postgres:5432/zero_repro
      ZERO_REPLICA_FILE: /tmp/zero.db
      ZERO_QUERY_URL: http://localhost:9999/zero-api/query
      ZERO_MUTATE_URL: http://localhost:9999/zero-api/mutate
      ZERO_QUERY_API_KEY: repro-key
      ZERO_MUTATE_API_KEY: repro-key
      ZERO_ADMIN_PASSWORD: repro-admin
      ZERO_LOG_LEVEL: info
    ports:
      - "4848:4848"
